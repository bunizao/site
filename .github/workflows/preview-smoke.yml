name: Preview Smoke

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      preview_url:
        description: Remote URL to test; omit to run against the local checked-out build
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    name: Preview Smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Resolve preview context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = String(context.payload.inputs?.preview_url ?? '').trim();

            if (previewUrl) {
              let parsedUrl;
              try {
                parsedUrl = new URL(previewUrl);
              } catch {
                core.setFailed(`Invalid preview URL: ${previewUrl}`);
                return;
              }

              if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
                core.setFailed(`Unsupported preview URL protocol: ${parsedUrl.protocol}`);
                return;
              }

              core.setOutput('preview_url', parsedUrl.toString());
              core.notice(`Running smoke tests against ${parsedUrl.toString()}.`);
              return;
            }

            core.setOutput('preview_url', '');
            core.notice('Running smoke tests against the local checked-out build.');

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build Cloudflare preview
        if: steps.context.outputs.preview_url == '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          PUBLIC_GHOST_URL: ${{ vars.PUBLIC_GHOST_URL || 'https://blog.buxx.me' }}
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}
          GHOST_CONTENT_APIKEY: ${{ secrets.GHOST_CONTENT_APIKEY }}
        run: bun run build:cloudflare

      - name: Configure Cloudflare Access preview
        if: steps.context.outputs.preview_url == '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          WORKER_NAME: site
        run: node .github/scripts/configure-cloudflare-access-preview.mjs

      - name: Upload Cloudflare preview
        id: cloudflare-preview
        if: steps.context.outputs.preview_url == '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number || github.run_id }}
          WORKER_NAME: site
        run: |
          set -o pipefail
          bunx wrangler versions upload \
            --config dist/server/wrangler.json \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "ci: preview smoke ${GITHUB_SHA}" \
            2>&1 | tee wrangler-preview.log
          node .github/scripts/read-wrangler-preview-url.mjs wrangler-preview.log

      - name: Run preview smoke tests
        env:
          E2E_BASE_URL: ${{ steps.context.outputs.preview_url || steps.cloudflare-preview.outputs.preview_url }}
        run: bunx playwright test tests/e2e/preview-smoke.pw.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
