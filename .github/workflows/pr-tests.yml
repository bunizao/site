name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, Unit, Build, Deployment Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Astro check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Production build
        env:
          GHOST_MOCK_CONTENT: '1'
        run: bun run build

      - name: Registry consumer check
        run: bun run test:registry

      - name: Reject mock Cloudflare deployment
        run: |
          if bun run guard:cloudflare-deploy > "$RUNNER_TEMP/wrangler-guard.log" 2>&1; then
            echo "Mock Cloudflare deployment unexpectedly passed."
            exit 1
          fi
          grep -F "Cloudflare deploy blocked mock Ghost posts" "$RUNNER_TEMP/wrangler-guard.log"

  site-e2e:
    name: Site E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run site e2e tests
        run: bun run test:e2e:site

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
