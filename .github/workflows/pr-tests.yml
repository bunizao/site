name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check, Unit, Build, Deployment Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unlock desk
        id: desk
        env:
          DESK_KEY: ${{ secrets.DESK_KEY }}
        run: |
          bash scripts/desk-unlock.sh
          node --input-type=module -e "import { isDeskUnlocked } from './scripts/desk-lock.mjs'; console.log('unlocked=' + isDeskUnlocked())" >> "$GITHUB_OUTPUT"

      - name: Verify encrypted desk blobs
        run: node scripts/check-desk-encryption.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Astro check
        run: bash scripts/desk-ci.sh bun run check

      - name: Unit tests
        run: bash scripts/desk-ci.sh bun run test:unit

      - name: Production build
        env:
          GHOST_MOCK_CONTENT: '1'
        run: bash scripts/desk-ci.sh bun run build

      - name: Registry consumer check
        run: bash scripts/desk-ci.sh bun run test:registry

      - name: Reject mock Cloudflare deployment
        run: |
          if bun run guard:cloudflare-deploy > "$RUNNER_TEMP/wrangler-guard.log" 2>&1; then
            echo "Mock Cloudflare deployment unexpectedly passed."
            exit 1
          fi
          grep -F "Cloudflare deploy blocked mock Ghost posts" "$RUNNER_TEMP/wrangler-guard.log"

  site-e2e:
    name: Site E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    env:
      E2E_WORKERS: 2
      PLAYWRIGHT_BROWSER_CHANNEL: chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unlock desk
        id: desk
        env:
          DESK_KEY: ${{ secrets.DESK_KEY }}
        run: |
          bash scripts/desk-unlock.sh
          node --input-type=module -e "import { isDeskUnlocked } from './scripts/desk-lock.mjs'; console.log('unlocked=' + isDeskUnlocked())" >> "$GITHUB_OUTPUT"

      - name: Verify encrypted desk blobs
        run: node scripts/check-desk-encryption.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright FFmpeg
        run: bunx playwright install ffmpeg

      - name: Run site e2e tests
        run: bash scripts/desk-ci.sh bun run test:e2e:site -- --fully-parallel --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: failure() && steps.desk.outputs.unlocked != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
