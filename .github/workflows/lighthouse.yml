name: Lighthouse

on:
  push:
    # Only audit production when production can actually change. Auditing buxx.me
    # on every feature-branch push just samples the same deployment under variable
    # runner load, which is what made the tracker flap open/closed on noise.
    branches: [main]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      deployment_url:
        description: URL to audit; defaults to the production Worker
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: lighthouse-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve deployment context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const inputUrl = context.payload.inputs?.deployment_url;
            const deploymentUrl = String(inputUrl || 'https://buxx.me').trim();
            const environment = context.eventName === 'workflow_dispatch' && inputUrl
              ? 'Manual'
              : 'Production';

            if (!deploymentUrl) {
              core.setFailed('Deployment URL is required.');
              return;
            }

            let parsedUrl;
            try {
              parsedUrl = new URL(deploymentUrl);
            } catch {
              core.setFailed(`Invalid deployment URL: ${deploymentUrl}`);
              return;
            }

            if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
              core.setFailed(`Unsupported deployment URL protocol: ${parsedUrl.protocol}`);
              return;
            }

            core.setOutput('deployment_url', parsedUrl.toString());
            core.setOutput('environment', environment);

      - name: Wait for Cloudflare production deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Warm production mood cache
        if: steps.context.outputs.environment == 'Production'
        env:
          LHCI_DEPLOYMENT_URL: ${{ steps.context.outputs.deployment_url }}
        run: |
          set -euo pipefail

          mood_url="$(node -e "console.log(new URL('/mood', process.env.LHCI_DEPLOYMENT_URL || 'https://buxx.me').toString())")"
          chrome_bin="${CHROME_BIN:-google-chrome}"
          user_agent="Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Mobile Safari/537.36"
          ready_count=0

          for attempt in 1 2 3; do
            html="$("$chrome_bin" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --user-agent="$user_agent" \
              --dump-dom "$mood_url" 2>/tmp/mood-warm-chrome.log || true)"

            if [[ "$html" == *"data-mood-initial-feed"* && "$html" == *"data-mood-id="* ]]; then
              ready_count=$((ready_count + 1))
            fi

            echo "warm mood attempt ${attempt}: ready_count=${ready_count}"

            if [[ "$ready_count" -ge 2 ]]; then
              exit 0
            fi

            sleep 1.5
          done

          cat /tmp/mood-warm-chrome.log || true
          echo "Mood page did not render real feed HTML through Chrome warm-up." >&2
          exit 1

      - name: Run Lighthouse CI
        id: lhci
        env:
          LHCI_DEPLOYMENT_URL: ${{ steps.context.outputs.deployment_url }}
          LHCI_ENVIRONMENT: ${{ steps.context.outputs.environment }}
        run: |
          bun x @lhci/cli@0.15.1 healthcheck --config=./config/lighthouse.cjs
          bun x @lhci/cli@0.15.1 collect --config=./config/lighthouse.cjs
          bun x @lhci/cli@0.15.1 upload --config=./config/lighthouse.cjs

      - name: Summarize Lighthouse result
        id: summary
        if: always()
        env:
          LHCI_DEPLOYMENT_URL: ${{ steps.context.outputs.deployment_url }}
          LHCI_ENVIRONMENT: ${{ steps.context.outputs.environment }}
        run: node .github/scripts/summarize-lighthouse.mjs

      - name: Resolve Lighthouse tracker policy
        id: tracker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_LIGHTHOUSE_SUMMARY_PATH: .lighthouseci/summary.json
        run: |
          set -euo pipefail

          previous_dir="$(mktemp -d)"
          previous_sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            previous_run="$(gh run list \
              --workflow lighthouse.yml \
              --event schedule \
              --status completed \
              --limit 1 \
              --json databaseId,headSha \
              --jq '.[0] | [.databaseId, .headSha] | @tsv' || true)"

            if [[ -n "${previous_run}" ]]; then
              IFS=$'\t' read -r previous_run_id previous_sha <<< "${previous_run}"
              if [[ "${previous_sha}" == "${GITHUB_SHA}" ]]; then
                gh run download "${previous_run_id}" \
                  --name lighthouse-report \
                  --dir "${previous_dir}" || true
              fi
            fi
          fi

          export PREVIOUS_SCHEDULED_SHA="${previous_sha}"
          export PREVIOUS_LIGHTHOUSE_SUMMARY_PATH="${previous_dir}/summary.json"
          node .github/scripts/lighthouse-tracker-policy.mjs

      - name: Redact Lighthouse artifacts
        if: always()
        run: node .github/scripts/redact-lighthouse-artifacts.mjs

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Notify abnormal Lighthouse result
        if: always() && steps.tracker.outputs.notify_anomaly == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const trackerIssueNumber = 24;
            const summaryPath = '.lighthouseci/summary.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Lighthouse failed before a summary could be generated.';
            const body = [
              summary.trim(),
              '',
              '---',
              '',
              'Artifacts are attached to this workflow run.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
            });

            if (issue.state === 'open') {
              core.notice(`Issue #${trackerIssueNumber} is already open; skipped duplicate notification.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
              state: 'open',
            });
            core.notice(`Updated and reopened issue #${trackerIssueNumber}.`);

      - name: Close resolved Lighthouse tracker
        if: steps.tracker.outputs.close_recovery == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const trackerIssueNumber = 24;
            const summaryPath = '.lighthouseci/summary.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Lighthouse recovered.';
            const body = [
              summary.trim(),
              '',
              '---',
              '',
              'The latest deployment is back inside the Lighthouse gates.',
            ].join('\n');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
            });

            if (issue.state === 'closed') {
              core.notice(`Issue #${trackerIssueNumber} is already closed; skipped duplicate recovery notification.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackerIssueNumber,
              state: 'closed',
              state_reason: 'completed',
            });
            core.notice(`Updated and closed issue #${trackerIssueNumber}.`);
