name: Ops Health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ops-health:
    name: Ops Health
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run ops health checks
        env:
          SITE_URL: https://buxx.me
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EXPECTED_WEBHOOK_URL: https://api.buxx.me/v2/telegram/webhook
          HD_IMAGE_HEALTH_SAMPLE_SIZE: 4
          HD_IMAGE_HEALTH_TIMEOUT_MS: 4000
          LIVE_PHOTO_DETAIL_IDS: 3327
        run: bun run test:ops
