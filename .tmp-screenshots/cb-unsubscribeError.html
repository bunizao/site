<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couldn’t pause updates. — buxx.me</title>
    <link rel="icon" type="image/svg+xml" href="/logo/peek.svg?v=3" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="preload" as="font" href="/fonts/geist-sans-variable.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/jetbrains-mono-variable.woff2" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Geist';
        src:
          url('/fonts/geist-sans-variable.woff2') format('woff2-variations'),
          url('/fonts/geist-sans-variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        src:
          url('/fonts/jetbrains-mono-variable.woff2') format('woff2-variations'),
          url('/fonts/jetbrains-mono-variable.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #f7f7f5;
        --card: #ffffff;
        --fg: #0a0a0a;
        --muted: #6b6b6b;
        --soft: #94949b;
        --hairline: rgba(10, 10, 10, 0.08);
        --hairline-strong: rgba(10, 10, 10, 0.14);
        --grid: rgba(10, 10, 10, 0.07);
        --peek-accent: #c44848;
        --accent-error: #c44848;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 18px 60px -28px rgba(20, 20, 30, 0.16);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #131313;
          --fg: #fafafa;
          --muted: #9b9b9b;
          --soft: #6c6c70;
          --hairline: rgba(255, 255, 255, 0.07);
          --hairline-strong: rgba(255, 255, 255, 0.13);
          --grid: rgba(255, 255, 255, 0.06);
          --peek-accent: #f87171;
          --accent-error: #f87171;
          --shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 24px 60px -28px rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
      }

      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        height: 100%;
      }

      body {
        font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        position: relative;
        overflow-x: hidden;
      }

      .grid-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image: radial-gradient(circle, var(--grid) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(ellipse at center, #000 32%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 32%, transparent 75%);
      }

      .congrats-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .congrats-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 480px;
        padding: 32px 20px;
      }

      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--hairline);
        border-radius: 20px;
        padding: 32px 36px 28px;
        box-shadow: var(--shadow);
      }

      /* Brand row */
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 36px;
        color: var(--fg);
        text-decoration: none;
      }

      .brand svg {
        width: 18px;
        height: 13.5px;
        display: block;
      }

      .brand-mark {
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      /* Eyebrow + title */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: -0.005em;
      }

      .eyebrow-dot {
        position: relative;
        width: 7px;
        height: 7px;
        border-radius: 999px;
      }

      .is-info .eyebrow-dot { background: var(--fg); }
      .is-success .eyebrow-dot { background: var(--fg); }
      .is-error .eyebrow-dot { background: var(--accent-error); }

      .eyebrow-dot::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.18;
        animation: pulse 2.6s ease-out infinite;
      }

      .is-info .eyebrow-dot::before { color: var(--fg); }
      .is-success .eyebrow-dot::before { color: var(--fg); }
      .is-error .eyebrow-dot::before { color: var(--accent-error); }

      @keyframes pulse {
        0% { transform: scale(0.6); opacity: 0.32; }
        70% { transform: scale(1.7); opacity: 0; }
        100% { transform: scale(1.7); opacity: 0; }
      }

      h1 {
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: var(--fg);
        margin-bottom: 14px;
      }

      .message {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.65;
        margin-bottom: 28px;
        max-width: 36ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 28px;
      }

      .button {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.005em;
        line-height: 1;
        height: 42px;
        padding: 0 18px;
        background: var(--fg);
        color: var(--card);
        border: 1px solid var(--fg);
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      }

      .button:hover {
        opacity: 0.88;
      }

      .button:active {
        transform: translateY(1px);
      }

      .button-arrow {
        display: inline-block;
        transition: transform 0.18s ease;
      }

      .button:hover .button-arrow {
        transform: translateX(3px);
      }

      .button--ghost {
        background: transparent;
        color: var(--fg);
        border-color: var(--hairline-strong);
      }

      .button--ghost:hover {
        background: rgba(10, 10, 10, 0.04);
        opacity: 1;
      }

      @media (prefers-color-scheme: dark) {
        .button--ghost:hover {
          background: rgba(255, 255, 255, 0.06);
        }
      }

      /* Fallback link block */
      .fallback {
        margin-top: -8px;
        margin-bottom: 28px;
      }

      .fallback-label {
        display: block;
        font-size: 12px;
        color: var(--soft);
        margin-bottom: 6px;
      }

      .fallback-url {
        display: inline-block;
        max-width: 100%;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--fg);
        text-decoration: none;
        word-break: break-all;
        background: rgba(10, 10, 10, 0.04);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 8px 11px;
        line-height: 1.5;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      @media (prefers-color-scheme: dark) {
        .fallback-url {
          background: rgba(255, 255, 255, 0.04);
        }
      }

      .fallback-url:hover {
        background: rgba(10, 10, 10, 0.06);
        border-color: var(--hairline-strong);
      }

      @media (prefers-color-scheme: dark) {
        .fallback-url:hover {
          background: rgba(255, 255, 255, 0.07);
        }
      }

      /* Footer */
      .footer-line {
        height: 1px;
        background: var(--hairline);
        margin: 0 0 16px;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--soft);
      }

      .footer a {
        color: var(--soft);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .footer a:hover {
        color: var(--fg);
      }

      /* Animations */
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate {
        animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .delay-1 { animation-delay: 0.05s; }
      .delay-2 { animation-delay: 0.10s; }
      .delay-3 { animation-delay: 0.16s; }
      .delay-4 { animation-delay: 0.22s; }
      .delay-5 { animation-delay: 0.28s; }

      @media (prefers-reduced-motion: reduce) {
        .animate { animation: none; }
        .eyebrow-dot::before { animation: none; }
      }

      @media (max-width: 480px) {
        .container { padding: 20px 14px; }
        .card { padding: 26px 22px 22px; border-radius: 18px; }
        h1 { font-size: 25px; }
        .message { font-size: 14px; }
      }

      /* Inline form (used by unsubscribe confirm) */
      form {
        display: inline-flex;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    
    <div class="container">
      <div class="card is-error">
        <a class="brand animate" href="/" aria-label="bunizao home">
          <svg viewBox="0 0 12 9" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
  <g fill="currentColor">
    <rect x="2" y="1" width="2" height="1"/><rect x="8" y="1" width="2" height="1"/>
    <rect x="1" y="2" width="3" height="1"/><rect x="8" y="2" width="3" height="1"/>
    <rect x="1" y="3" width="10" height="1"/>
    <rect x="1" y="4" width="10" height="1"/>
    <rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="4" height="1"/><rect x="9" y="5" width="2" height="1"/>
    <rect x="1" y="6" width="2" height="1"/><rect x="4" y="6" width="2" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="9" y="6" width="2" height="1"/>
    <rect x="6" y="6" width="1" height="1" fill="var(--peek-accent)"/>
    <rect x="1" y="7" width="10" height="1"/>
  </g>
</svg>
          <span class="brand-mark">bunizao</span>
        </a>
        <div class="eyebrow animate delay-1">
          <span class="eyebrow-dot" aria-hidden="true"></span>
          <span>Something went off</span>
        </div>
        <h1 class="animate delay-2">Couldn’t pause updates.</h1>
        <p class="message animate delay-3">This unsubscribe link looks off. Try again from a recent email.</p>
        <div class="actions animate delay-4"><a href="/mood" class="button"><span>Open mood feed</span><span class="button-arrow" aria-hidden="true">&rarr;</span></a></div>
        <div class="footer-line animate delay-5" aria-hidden="true"></div>
        <div class="footer animate delay-5">
          <span>bunizao &middot; buxx.me</span>
          <a href="/mood">mood feed &rarr;</a>
        </div>
      </div>
    </div>
    
  </body>
</html>
