<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language switcher — prototype v4</title>
<!--
  THROWAWAY PROTOTYPE v4. Not wired to anything, not shipped, no tests.

  Settled: listing = one `languages` glyph, no letters. Article = one pill that
  opens a small menu. No "remember" control — an explicit pick is remembered
  silently, exactly like the theme toggle.

  Only open question left in here: POSITION (pill leads or trails the tag row).
-->
<style>
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; background: #fff; color: #17171a;
         font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; }

  /* --- prototype chrome (deliberately NOT the design being judged) -------- */
  .chrome { position: sticky; top: 0; z-index: 100; background: #0b0b0d; color: #e8e8ea;
            border-bottom: 1px solid #222; padding: 9px 16px; display: flex; flex-wrap: wrap;
            align-items: center; gap: 7px 16px; font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chrome__group { display: flex; align-items: center; gap: 5px; }
  .chrome__label { color: #6e6e78; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
  .chrome button { font: inherit; font-size: 11px; cursor: pointer; background: #1a1a1f; color: #b8b8c0;
                   border: 1px solid #2a2a32; border-radius: 5px; padding: 4px 9px; transition: 0.12s; }
  .chrome button:hover { background: #24242c; color: #fff; }
  .chrome button[aria-pressed="true"] { background: #e8e8ea; color: #0b0b0d; border-color: #e8e8ea; }
  .chrome__state { width: 100%; color: #6e6e78; font-size: 11px; border-top: 1px solid #1c1c22;
                   margin-top: 2px; padding-top: 7px; }
  .chrome__state b { color: #9ecbff; font-weight: 500; }

  .verdict { max-width: 1400px; margin: 0 auto; padding: 18px 24px 0; font-size: 13px; line-height: 1.62; }
  .verdict h1 { font-size: 14px; margin: 0 0 5px; letter-spacing: -0.01em; }
  .verdict p { margin: 0 0 4px; color: #6b6b72; max-width: 88ch; }
  .verdict code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .verdict .cost { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #8a8a92; }
  html[data-theme="dark"] body { background: #050505; color: #d8d8dc; }
  html[data-theme="dark"] .verdict p { color: #85858e; }
  html[data-theme="dark"] .verdict h1 { color: #e8e8ea; }

  .stage { max-width: 1400px; margin: 0 auto; padding: 16px 24px 160px; display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 1080px) { .stage { grid-template-columns: 1fr 1fr; } }
  .screen { border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; }
  .screen__bar { font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 7px 12px; color: #7a7a82;
                 background: rgba(0,0,0,0.03); border-bottom: 1px solid rgba(0,0,0,0.08); border-radius: 11px 11px 0 0; }
  html[data-theme="dark"] .screen { border-color: rgba(255,255,255,0.12); }
  html[data-theme="dark"] .screen__bar { background: rgba(255,255,255,0.04); border-bottom-color: rgba(255,255,255,0.08); color: #8a8a92; }

  a { text-decoration: none; color: inherit; }

  /* --- real blog tokens, copied from src/styles/blog.css ------------------ */
  .blog-zone {
    --foreground: 0 0% 0%; --background: 0 0% 100%;
    --blog-accent: #3C5D80;
    --blog-ink: hsl(var(--foreground));
    --blog-body: hsl(var(--foreground) / 0.78);
    --blog-muted: hsl(var(--foreground) / 0.58);
    --blog-faint: hsl(var(--foreground) / 0.42);
    --blog-line: hsl(var(--foreground) / 0.1);
    color: var(--blog-body); background: hsl(var(--background));
    padding: 24px 26px 34px; min-height: 520px; border-radius: 0 0 11px 11px;
  }
  html[data-theme="dark"] .blog-zone {
    --foreground: 0 0% 100%; --background: 0 0% 4%;
    --blog-accent: #7FA8D6;
  }
  .blog-zone :focus-visible { outline: 2px solid var(--blog-accent); outline-offset: 2px; border-radius: 999px; }

  .blog-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .blog-mark { font-size: 15px; letter-spacing: 0.04em; color: var(--blog-ink); }
  .blog-iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
                  border-radius: 999px; color: var(--blog-faint); background: none; border: none; cursor: pointer; }
  .blog-iconbtn svg { width: 18px; height: 18px; }

  /* --- listing (unchanged from v3) --------------------------------------- */
  .blog-list { list-style: none; margin: 0; padding: 0; }
  .blog-row { border-bottom: 1px solid var(--blog-line); }
  .blog-row__title { font-size: 16.5px; font-weight: 500; line-height: 1.45; color: var(--blog-ink); margin: 14px 0 0; letter-spacing: -0.005em; }
  .blog-row__excerpt { margin-top: 5px; font-size: 15px; line-height: 1.55; color: var(--blog-muted); }
  .blog-row__meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin: 9px 0 0; padding-bottom: 16px; }
  .blog-row__date { font-size: 13px; line-height: 1.4; color: var(--blog-faint); font-variant-numeric: tabular-nums; }
  .blog-row__tags { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .blog-row__tag { font-size: 11.5px; line-height: 1; padding: 4px 9px; border-radius: 999px;
                   color: var(--blog-faint); background: hsl(var(--foreground) / 0.04); }
  /* Glyph only. A mark, not a control — the row is already one link target. */
  .row-lang { display: inline-flex; align-items: center; color: var(--blog-accent); }
  .row-lang svg { width: 14px; height: 14px; }

  /* --- article: REAL numbers from blog.css -------------------------------- */
  .blog-article__header { margin-bottom: 40px; }
  .blog-article__title { font-size: 30px; line-height: 1.3; font-weight: 600; letter-spacing: -0.02em;
                         color: var(--blog-ink); margin: 0 0 14px; }
  .blog-article__meta { font-size: 14px; line-height: 20px; color: var(--blog-faint);
                        font-variant-numeric: tabular-nums; margin: 0; }
  .blog-article__meta span + span::before { content: '·'; margin: 0 8px; }
  .blog-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; list-style: none; margin: 16px 0 0; padding: 0; }
  .blog-tag { display: inline-flex; font-size: 12.5px; line-height: 1; padding: 6px 11px; border-radius: 999px;
              color: var(--blog-muted); background: hsl(var(--foreground) / 0.05);
              transition: color 0.16s ease, background-color 0.16s ease; }
  .blog-tag:hover { color: var(--blog-ink); background: hsl(var(--foreground) / 0.09); }
  .blog-cover { margin-top: 22px; height: 150px; border-radius: 14px;
                background: linear-gradient(135deg, #b9a6e8, #8f7fd0 45%, #6f6ab5); }
  .blog-prose p { font-size: 17px; line-height: 1.85; color: var(--blog-body); margin: 0 0 16px; }

  /* --- the language pill -------------------------------------------------- */
  /* Same family as .blog-tag by construction: identical font-size, padding and
     radius, so it can NOT drift out of alignment the way the old `en` chip did.
     Three things separate it from a tag: the accent glyph (same glyph as the
     listing mark — that is the through-line), an ink label instead of muted,
     and a chevron that says "this opens something". */
  .lang { position: relative; display: inline-flex; }
  .lang__pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12.5px; line-height: 1; cursor: pointer;
    padding: 6px 9px 6px 10px; border: none; border-radius: 999px;
    color: var(--blog-ink); background: hsl(var(--foreground) / 0.05);
    transition-property: background-color, scale;
    transition-duration: 160ms, 120ms; transition-timing-function: ease;
  }
  .lang__pill:hover { background: hsl(var(--foreground) / 0.09); }
  .lang__pill:active { scale: 0.96; }
  /* 24.5px clears WCAG 2.5.8 AA on its own; this lifts it to ~34px without
     crossing into the neighbouring tag's 8px gutter. Hit areas must not overlap. */
  .lang__pill::before { content: ''; position: absolute; inset: -5px -3px; }
  .lang__glyph { color: var(--blog-accent); display: inline-flex; }
  .lang__glyph svg { width: 13px; height: 13px; }
  .lang__chev { color: var(--blog-faint); display: inline-flex; }
  .lang__chev svg { width: 12px; height: 12px; transition: rotate 160ms ease; }
  .lang__pill[aria-expanded="true"] .lang__chev svg { rotate: 180deg; }

  /* --- treatments: the pill has to read as a CONTROL, not as one more tag --- */

  /* rule — a hairline saying "different group". Proximity does the work, so the
     pill itself can stay neutral and quiet. */
  .tag-sep { width: 1px; height: 15px; flex: none; background: hsl(var(--foreground) / 0.15); }

  /* tint — 12% accent, the house idiom already used by .blog-row__tag:hover and
     .toc-topbar__link.active. Article tags hover to neutral ink, never accent,
     so nothing in this row collides with it. */
  .lang[data-treat="tint"] .lang__pill,
  .lang[data-treat="both"] .lang__pill {
    color: var(--blog-accent);
    background: color-mix(in srgb, var(--blog-accent) 12%, transparent);
  }
  .lang[data-treat="tint"] .lang__pill:hover,
  .lang[data-treat="both"] .lang__pill:hover {
    background: color-mix(in srgb, var(--blog-accent) 19%, transparent);
  }
  .lang[data-treat="tint"] .lang__chev,
  .lang[data-treat="both"] .lang__chev { color: color-mix(in srgb, var(--blog-accent) 55%, transparent); }

  /* outline — fill vs outline is the loudest structural difference available
     without spending colour: every tag is filled, this one is not. */
  .lang[data-treat="outline"] .lang__pill {
    color: var(--blog-accent); background: transparent;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blog-accent) 45%, transparent);
  }
  .lang[data-treat="outline"] .lang__pill:hover {
    background: color-mix(in srgb, var(--blog-accent) 8%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blog-accent) 48%, transparent);
  }
  .lang[data-treat="outline"] .lang__chev { color: color-mix(in srgb, var(--blog-accent) 55%, transparent); }

  /* Concentric: 12px outer = 8px inner + 4px padding. */
  .menu {
    position: absolute; z-index: 40; top: calc(100% + 7px); min-width: 138px;
    padding: 4px; border-radius: 12px; background: hsl(var(--background));
    box-shadow: 0 0 0 1px hsl(var(--foreground) / 0.08),
                0 8px 24px hsl(var(--foreground) / 0.12),
                0 2px 5px hsl(var(--foreground) / 0.05);
  }
  /* Optical justify: the menu's labels sit on the same vertical line as the
     pill's label, not its box edge. Pill label starts at 10+13+6 = 29px from
     the pill's left; menu label starts at 4+8+13+8 = 33px from the menu's left.
     Shifting the menu -4px lines the two text columns up. Right-anchored is the
     collision fallback, aligned to the pill's box (nothing to line up against). */
  .menu[data-anchor="left"] { left: -4px; }
  .menu[data-anchor="right"] { right: 0; }
  /* Bridges the 7px gap so travelling pill -> menu never leaves .lang and never
     triggers mouseleave. Cheaper and more reliable than a safe-triangle. */
  .menu::before { content: ''; position: absolute; left: 0; right: 0; top: -7px; height: 7px; }
  @media (prefers-reduced-motion: no-preference) {
    .menu { animation: menu-in 140ms cubic-bezier(0.2, 0, 0, 1); transform-origin: top var(--o, left); }
    @keyframes menu-in { from { opacity: 0; scale: 0.97; translate: 0 -3px; } }
  }
  .menu__item {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    font-size: 13px; line-height: 1; padding: 8px 11px 8px 8px; border-radius: 8px;
    color: var(--blog-muted); transition: background-color 120ms ease, color 120ms ease;
  }
  .menu__item:hover { background: hsl(var(--foreground) / 0.05); color: var(--blog-ink); }
  .menu__item[aria-current="true"] { color: var(--blog-ink); }
  .menu__check { width: 13px; flex: none; display: inline-flex; color: var(--blog-accent); }
  .menu__check svg { width: 13px; height: 13px; }
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome__group">
    <span class="chrome__label">treatment</span>
    <button data-set="treat" data-val="rule">rule</button>
    <button data-set="treat" data-val="tint">tint</button>
    <button data-set="treat" data-val="outline">outline</button>
    <button data-set="treat" data-val="both">rule+tint</button>
  </div>
  <div class="chrome__group">
    <span class="chrome__label">versions</span>
    <button data-set="langCount" data-val="1">1</button>
    <button data-set="langCount" data-val="2">2</button>
    <button data-set="langCount" data-val="3">3</button>
    <button data-set="langCount" data-val="5">5</button>
  </div>
  <div class="chrome__group">
    <span class="chrome__label">reader</span>
    <button data-set="reader" data-val="zh">zh</button>
    <button data-set="reader" data-val="en">en</button>
    <button data-set="reader" data-val="ja">ja</button>
    <button data-set="reader" data-val="fr">fr</button>
  </div>
  <div class="chrome__group">
    <span class="chrome__label">decided</span>
    <button data-set="decided" data-val="0">no</button>
    <button data-set="decided" data-val="1">yes</button>
  </div>
  <div class="chrome__group">
    <span class="chrome__label">theme</span>
    <button data-set="theme" data-val="light">light</button>
    <button data-set="theme" data-val="dark">dark</button>
  </div>
  <div class="chrome__state" id="state"></div>
</div>

<div class="verdict" id="verdict"></div>

<div class="stage">
  <div class="screen">
    <div class="screen__bar">/blog &nbsp;—&nbsp; listing · follows preference</div>
    <div class="blog-zone" id="listing"></div>
  </div>
  <div class="screen">
    <div class="screen__bar">/blog/lun-chenmo &nbsp;—&nbsp; article</div>
    <div class="blog-zone" id="article"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// data — five is the ceiling now, so no search, no grouping, no overflow.
// ---------------------------------------------------------------------------
const LANGS = [['zh','中文'], ['en','English'], ['ja','日本語'], ['fr','Français'], ['ko','한국어']];
const NAME = Object.fromEntries(LANGS);

// Reader-facing strings keyed by the language they are written IN.
// Real thing: blog.copy[locale]. Nothing hardcoded in .astro.
const COPY = {
  zh: { pick:'切换语言', mark:(l)=>`也有${l}版本`, multi:'还有其他语言版本' },
  en: { pick:'Change language', mark:(l)=>`Also in ${l}`, multi:'Also in other languages' },
  ja: { pick:'言語を変更', mark:(l)=>`${l}版もあります`, multi:'他の言語版もあります' },
  fr: { pick:'Changer de langue', mark:(l)=>`Aussi en ${l}`, multi:'Aussi en d’autres langues' },
  ko: { pick:'언어 변경', mark:(l)=>`${l} 버전도 있습니다`, multi:'다른 언어 버전도 있습니다' },
};
const copy = (l) => COPY[l] || COPY.en;

const POSTS = [
  { slug:'lun-chenmo', origin:'zh', translated:true,
    title:{ zh:'论沉默', en:'On Silence', ja:'沈黙について', fr:'Du silence', ko:'침묵에 대하여' },
    excerpt:{ zh:'不说话不是没有话说。有些句子在被讲出来的那一刻就死了，所以我把它们留在原地。',
              en:'Saying nothing is not having nothing to say. Some sentences die the moment they are spoken.',
              ja:'黙っていることは、言うことがないということではない。',
              fr:'Ne rien dire n’est pas n’avoir rien à dire.',
              ko:'말하지 않는 것이 할 말이 없다는 뜻은 아니다.' },
    date:'Aug 27, 2026', read:'6 min read', tags:['碎碎念','独白'] },
  { slug:'yi-xiang', origin:'zh', translated:false,
    title:{ zh:'在异乡醒来' },
    excerpt:{ zh:'第一个月我数窗外的乌鸦，第二个月我开始听懂它们在吵什么。' },
    date:'Jul 14, 2026', read:'9 min read', tags:['迁徙','生活'] },
  { slug:'notes-on-latency', origin:'en', translated:true,
    title:{ en:'Notes on Latency', zh:'关于延迟的笔记', ja:'レイテンシについての覚書', fr:'Notes sur la latence', ko:'지연에 대한 메모' },
    excerpt:{ en:'Every millisecond you shave off is a millisecond someone else spends waiting for you to notice they were there.',
              zh:'你省下的每一毫秒，都是别人在等你注意到他们的一毫秒。',
              ja:'削り取った一ミリ秒は、誰かが待っていた一ミリ秒だ。',
              fr:'Chaque milliseconde gagnée est une milliseconde passée à vous attendre.',
              ko:'당신이 줄인 밀리초는 누군가 기다린 밀리초다.' },
    date:'May 02, 2026', read:'11 min read', tags:['engineering','perf'] },
  { slug:'shou-ji-pi', origin:'zh', translated:false,
    title:{ zh:'关于收集癖' },
    excerpt:{ zh:'我买的不是书，是"以后会读它"这件事本身。' },
    date:'Mar 09, 2026', read:'4 min read', tags:['癖好'] },
];
const BODY = {
  zh:['一个人不说话的时候，别人总以为他在等一个更好的时机。事实上他只是不想让那句话变成别的东西。',
      '语言是一种压缩算法，而且是有损的。你把一整个下午的光线、一杯凉掉的茶、和一次没打出去的电话压进四个字里，然后交给对方去解压。'],
  en:['When someone stays quiet, everyone assumes they are waiting for a better moment. In fact they simply do not want the sentence to become something else.',
      'Language is a compression algorithm, and a lossy one. You pack an entire afternoon of light, a cup of tea gone cold, and a call you never placed into four words, then hand it over to be decompressed by someone else.'],
  ja:['人が黙っているとき、周りはもっと良い機会を待っているのだと思う。実際は、その言葉が別の何かになるのを望んでいないだけだ。',
      '言語は圧縮アルゴリズムであり、しかも不可逆だ。'],
  fr:['Quand quelqu’un se tait, tout le monde suppose qu’il attend un meilleur moment. En réalité, il ne veut simplement pas que la phrase devienne autre chose.',
      'La langue est un algorithme de compression, et avec pertes.'],
  ko:['누군가 침묵할 때, 사람들은 더 좋은 순간을 기다린다고 여긴다. 사실은 그 말이 다른 무언가가 되기를 원하지 않을 뿐이다.',
      '언어는 압축 알고리즘이고, 그것도 손실이 있는 쪽이다.'],
};
const body = (c) => BODY[c] || BODY.en;

// stroke 1.5 beside 400-weight text — better-ui/icons.md
const svg = (d, w = 1.5) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  languages: svg('<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>', 2),
  chevron: svg('<path d="m6 9 6 6 6-6"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>'),
};

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
// Position is settled: the pill trails the tags.
const S = { treat: 'both', langCount: 3, reader: 'en', decided: false, theme: 'light', open: false };

const available = () => LANGS.slice(0, S.langCount).map((l) => l[0]);
const versionsOf = (p) => p.translated ? available() : [p.origin];
const resolveFor = (p) => versionsOf(p).includes(S.reader) ? S.reader : p.origin;
// The listing follows an EXPLICIT decision only. A sniffed guess is not a decision.
const listingLangFor = (p) => (S.decided && versionsOf(p).includes(S.reader)) ? S.reader : p.origin;

// ---------------------------------------------------------------------------
// LISTING
// ---------------------------------------------------------------------------
function renderListing() {
  const rows = POSTS.map((p) => {
    const lang = listingLangFor(p);
    const marked = versionsOf(p).length > 1 && versionsOf(p).includes(S.reader);
    // The row is either already in the reader's language (then the mark means
    // "there are other versions") or it is not (then it means "yours is inside").
    // One glyph, two honest names — "also in 中文" on a row already in 中文 is noise.
    const label = lang === S.reader ? copy(S.reader).multi : copy(S.reader).mark(NAME[S.reader]);
    return `<li class="blog-row">
      <a><h2 class="blog-row__title" lang="${lang}">${p.title[lang] || p.title[p.origin]}</h2>
      <p class="blog-row__excerpt" lang="${lang}">${p.excerpt[lang] || p.excerpt[p.origin]}</p></a>
      <p class="blog-row__meta">
        <span class="blog-row__date">${p.date}</span>
        ${marked ? `<span class="row-lang" role="img" aria-label="${label}" title="${label}">${I.languages}</span>` : ''}
        <span class="blog-row__tags">${p.tags.map((t) => `<a class="blog-row__tag">${t}</a>`).join('')}</span>
      </p></li>`;
  }).join('');
  return `<div class="blog-topbar"><a class="blog-mark">無人之境</a>
      <button class="blog-iconbtn" aria-label="主题">${I.sun}</button></div>
    <ul class="blog-list">${rows}</ul>`;
}

// ---------------------------------------------------------------------------
// ARTICLE
// ---------------------------------------------------------------------------
function renderArticle() {
  const p = POSTS[0];
  const v = versionsOf(p);
  const cur = resolveFor(p);
  const ui = copy(cur);
  const anchor = 'left';   // justify() flips this to 'right' only on collision
  const ruled = S.treat === 'rule' || S.treat === 'both';

  // One version = no control. Nothing to switch to, so nothing is drawn.
  const langPill = v.length < 2 ? '' : `<li class="lang" data-treat="${S.treat}">
    <button class="lang__pill" data-toggle="open" aria-expanded="${S.open}"
      aria-haspopup="menu" aria-label="${ui.pick}">
      <span class="lang__glyph">${I.languages}</span>
      <span lang="${cur}">${NAME[cur]}</span>
      <span class="lang__chev">${I.chevron}</span>
    </button>
    ${S.open ? `<div class="menu" data-menu data-anchor="${anchor}" style="--o:${anchor}" role="menu" aria-label="${ui.pick}">
      ${v.map((c) => `<a class="menu__item" role="menuitemradio" aria-checked="${c === cur}" aria-current="${c === cur}"
          href="?lang=${c}" hreflang="${c}" lang="${c}" rel="alternate" data-pick="${c}" tabindex="-1">
          <span class="menu__check">${c === cur ? I.check : ''}</span><span>${NAME[c]}</span></a>`).join('')}
    </div>` : ''}
  </li>`;

  const tags = p.tags.map((t) => `<li><a class="blog-tag">${t}</a></li>`).join('');
  const sep = (ruled && v.length > 1) ? '<li class="tag-sep" aria-hidden="true"></li>' : '';

  return `<div class="blog-topbar"><a class="blog-mark">← 無人之境</a>
      <button class="blog-iconbtn" aria-label="主题">${I.sun}</button></div>
    <div class="blog-article__header">
      <h1 class="blog-article__title" lang="${cur}">${p.title[cur] || p.title[p.origin]}</h1>
      <p class="blog-article__meta"><span>${p.date}</span><span>${p.read}</span></p>
      <ul class="blog-tags">${tags}${sep}${langPill}</ul>
      <div class="blog-cover"></div>
    </div>
    <div class="blog-prose" lang="${cur}">${body(cur).map((t) => `<p>${t}</p>`).join('')}</div>`;
}

// ---------------------------------------------------------------------------
// notes
// ---------------------------------------------------------------------------
const NOTE = `<h1>v5 — 让 pill 从 tag 堆里站出来</h1>
  <p>位置定了：<b>trail</b>，pill 排在 tag 后面。剩下的问题是它长得太像第五个 tag —— 因为它<b>就是</b>按 tag 的几何长的，这是对齐的代价。四个解法，黑条里切：</p>
  <p><b>rule</b> —— 加一条 1px×15px 的竖线，pill 本身保持中性。这条靠的是接近性：线左边是分类，右边是控件。最安静，也最不会和 tag 抢注意力。缺点是它只说了「不是一伙的」，没说「这个能点开东西」。</p>
  <p><b>tint</b> —— <code>color-mix(in srgb, var(--blog-accent) 12%, transparent)</code> + accent 文字。这个 12% 不是我编的，是仓库里现成的惯例，<code>.blog-row__tag:hover</code> 和 <code>.toc-topbar__link.active</code> 用的都是它。文章页的 <code>.blog-tag:hover</code> 走中性 ink、不碰 accent，所以这一行里不会有「一个永远处于 hover 态的 tag」的误读。它同时接上了主页那个 accent 标记 —— 两屏一条色线。</p>
  <p><b>outline</b> —— 透明底 + 1px accent 描边。tag 全是实心的，就它是空心的；「实心 vs 空心」是不花颜色就能拿到的最大结构差异。比 tint 轻，但在深色下描边容易糊。</p>
  <p><b>rule+tint（默认，我选这个）</b> —— 两件事各干各的：竖线负责「这是另一组」，tint 负责「这是个控件」。单用 rule 不够明显（你已经说了），单用 tint 它还是排在 tag 序列里像个高亮 tag。两个一起才把分组和可操作性都讲清楚，而代价只有一条 1px 的线。</p>
  <p class="cost">几何完全没动：仍然是 <code>12.5px / padding 6px 11px / 999px</code>，和 tag 同高 25px · 竖线不吃额外间距，用 <code>.blog-tags</code> 自己的 <code>gap: 8px</code> · 菜单靠右挂（pill 在行尾）· 热区 87×35，不越过 8px 间隙</p>`;

// ---------------------------------------------------------------------------
// render + events
// ---------------------------------------------------------------------------
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.querySelectorAll('.chrome button[data-set]').forEach((b) => {
    const val = S[b.dataset.set];
    b.setAttribute('aria-pressed', String(val === true ? 1 : val === false ? 0 : val) === b.dataset.val);
  });

  const p = POSTS[0], v = versionsOf(p);
  document.getElementById('state').innerHTML =
    `versions <b>${v.length}</b> · reader <b>${S.reader}</b> · resolved <b>${resolveFor(p)}</b>` +
    ` · source <b>${S.decided ? 'cookie blog_lang' : 'Accept-Language'}</b>` +
    ` · control <b>${v.length < 2 ? 'none' : S.treat}</b>` +
    ` · listing rows swapped <b>${POSTS.filter((q) => listingLangFor(q) !== q.origin).length}</b>`;

  document.getElementById('verdict').innerHTML = NOTE;
  document.getElementById('listing').innerHTML = renderListing();
  document.getElementById('article').innerHTML = renderArticle();
}

const items = () => [...document.querySelectorAll('.menu__item')];
// Hovering must not steal focus — the cursor is not the keyboard. Only a click
// or Enter moves focus into the menu.
function openMenu(focus = true) {
  S.open = true; render(); justify();
  if (focus) (document.querySelector('.menu__item[aria-current="true"]') || items()[0])?.focus();
}

// Left-anchored by default; flip to right only when the menu would run past the
// reading column. Two states, measured after paint — no popover library.
function justify() {
  const menu = document.querySelector('.menu');
  if (!menu) return;
  const edge = menu.closest('.blog-zone').getBoundingClientRect().right - 26;
  if (menu.getBoundingClientRect().right > edge) menu.dataset.anchor = 'right';
}
function closeMenu(restore) {
  S.open = false; render();
  if (restore) document.querySelector('.lang__pill')?.focus();
}
function move(dir) {
  const o = items(); if (!o.length) return;
  const i = o.indexOf(document.activeElement);
  o[i === -1 ? 0 : (i + dir + o.length) % o.length].focus();
}

document.addEventListener('click', (e) => {
  const set = e.target.closest('[data-set]');
  if (set) {
    const { set: k, val } = set.dataset;
    S[k] = k === 'langCount' ? Number(val) : k === 'decided' ? val === '1' : val;
    S.open = false;
    return render();
  }
  if (e.target.closest('[data-toggle="open"]')) {
    e.preventDefault();
    clearTimeout(timer);
    return S.open ? closeMenu(true) : openMenu();
  }
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    e.preventDefault();
    // The pick IS the decision. Cookie written, no confirmation, no toggle —
    // same contract as the theme switch.
    S.reader = pick.dataset.pick; S.decided = true;
    return closeMenu(true);
  }
  if (S.open && !e.target.closest('[data-menu]')) closeMenu(false);
});

// Hover to open, on fine pointers only. Touch has no hover and would open on
// the same tap that should activate, so it stays click-only. Delays are the
// whole trick: 90ms in stops menus flashing open as the cursor crosses the row,
// 200ms out survives the diagonal travel down to the menu.
const HOVER = window.matchMedia('(hover: hover) and (pointer: fine)');
let timer;
function intend(open) {
  clearTimeout(timer);
  if (open === S.open) return;
  timer = setTimeout(() => (open ? openMenu(false) : closeMenu(false)), open ? 90 : 200);
}
document.addEventListener('pointerover', (e) => {
  if (!HOVER.matches || e.pointerType !== 'mouse') return;
  const lang = e.target.closest('.lang');
  if (lang) intend(true);
});
document.addEventListener('pointerout', (e) => {
  if (!HOVER.matches || e.pointerType !== 'mouse') return;
  // relatedTarget inside .lang means we only moved between the pill and the menu.
  if (e.target.closest('.lang') && !e.relatedTarget?.closest?.('.lang')) intend(false);
});

document.addEventListener('keydown', (e) => {
  if (!S.open) return;
  if (e.key === 'Escape') { e.preventDefault(); return closeMenu(true); }
  if (e.key === 'ArrowDown') { e.preventDefault(); return move(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); return move(-1); }
});

render();
</script>
</body>
</html>
