<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>無人之境 — buxx.me</title>
  <style>
    /* Tab strips ignore site CSS, so the dark-mode swap rides inside the SVG.
       The mark is pure black on transparent: invert() flips it clean white. */
    @media (prefers-color-scheme: dark) {
      image { filter: invert(1); }
    }
  </style>
  <image width="128" height="128" href="data:image/webp;base64,"/>
</svg>
