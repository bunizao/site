name = "notify-scheduler"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
# Site origin that exposes /api/notify/schedule and /api/notify/retry
NOTIFY_BASE_URL = "https://buxx.me"

[triggers]
crons = ["*/15 * * * *"]

# Secrets (set via `npx wrangler secret put <NAME>`):
# - NOTIFY_CRON_SECRET    (same value as Vercel CRON_SECRET)
# - WORKER_MANUAL_TOKEN   (optional, used to trigger POST manually)
