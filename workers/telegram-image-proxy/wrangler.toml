name = "telegram-image-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
routes = [
  { pattern = "image.buxx.me", zone_name = "buxx.me", custom_domain = true }
]

# R2 Bucket binding - update bucket_name after running:
# wrangler r2 bucket create mood-images
[[r2_buckets]]
binding = "MOOD_IMAGES"
bucket_name = "mood-images"

[vars]
# Optional. Used when R2 miss fallback needs to scrape Telegram public page.
# Defaults to "tutumood" if omitted.
TELEGRAM_PUBLIC_CHANNEL = "tutumood"

# Custom domain configuration (set up in Cloudflare Dashboard):
# Workers -> telegram-image-proxy -> Triggers -> Add Custom Domain -> image.buxx.me

# Secrets (set via `npx wrangler secret put <NAME>`):
# - TELEGRAM_BOT_TOKEN
# - HD_IMAGE_INGEST_TOKEN
